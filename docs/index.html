<!doctype html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://avoin-karttakuva.maanmittauslaitos.fi https://tile.openstreetmap.org; connect-src 'self' https://avoin-karttakuva.maanmittauslaitos.fi https://opendata.fmi.fi https://api.open-meteo.com https://api.met.no; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Metsäkartta</title>
  <meta name="description" content="Offline-kartta metsän iästä Metsähallituksen lupa-alueilla">
  <meta name="theme-color" content="#0f1712">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Metsäkartta">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map" aria-label="Kartta"></div>

  <header class="topbar">
    <button id="areaBtn" class="area-btn" type="button" aria-haspopup="dialog">
      <span class="area-btn-label">Lupa-alue</span>
      <span id="areaName" class="area-btn-name">Valitse alue</span>
      <svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 10l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="topbar-chips">
      <span id="netChip" class="chip chip-warn" hidden>Offline</span>
      <span id="gpsChip" class="chip" hidden></span>
    </div>
    <button id="settingsBtn" class="icon-btn" type="button" aria-label="Asetukset">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7z" fill="none" stroke="currentColor" stroke-width="2"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
    </button>
  </header>

  <nav class="fabs" aria-label="Karttatyökalut">
    <button id="windBtn" class="fab fab-wind" type="button" aria-label="Tuuli" aria-haspopup="dialog" hidden>
      <svg class="wind-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2l6 8h-4v12h-4V10H6z" fill="currentColor"/></svg>
      <span id="windSpd" class="wind-spd"></span>
    </button>
    <button id="locateBtn" class="fab" type="button" aria-label="Oma sijainti" aria-pressed="false">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1v3M12 20v3M1 12h3M20 12h3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
    <button id="layersBtn" class="fab" type="button" aria-label="Karttatasot" aria-haspopup="dialog">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l9 5-9 5-9-5 9-5z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M3 13l9 5 9-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
    </button>
    <div class="fab-pair">
      <button id="zoomInBtn" class="fab fab-sq" type="button" aria-label="Lähennä"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
      <button id="zoomOutBtn" class="fab fab-sq" type="button" aria-label="Loitonna"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
    </div>
  </nav>

  <section id="rainBar" class="rain-bar" hidden aria-label="Sade-ennuste">
    <div class="rain-top">
      <button id="rainPlay" class="rain-btn" type="button" aria-label="Toista sade-ennuste"></button>
      <input id="rainSlider" type="range" min="0" max="0" step="1" value="0" aria-label="Ennusteaika">
      <button id="rainNow" class="rain-now" type="button">Nyt</button>
      <button id="rainHide" class="rain-btn" type="button" aria-label="Piilota sadetaso">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="rain-info"><b id="rainTime">Sade</b> <span id="rainHere"></span></div>
  </section>

  <section id="infoCard" class="info-card" hidden aria-live="polite"></section>

  <div id="backdrop" class="backdrop" hidden></div>
  <section id="sheet" class="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden>
    <div class="sheet-head">
      <h2 id="sheetTitle"></h2>
      <button id="sheetClose" class="icon-btn" type="button" aria-label="Sulje">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div id="sheetBody" class="sheet-body"></div>
  </section>

  <div id="toast" class="toast" role="status" hidden></div>

  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="core.js"></script>
  <script src="app.js"></script>
</body>
</html>
